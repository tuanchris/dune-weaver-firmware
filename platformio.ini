; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = FluidNC
include_dir = FluidNC/include
; lib_dir = libraries
test_dir = FluidNC/tests
data_dir = FluidNC/data
default_envs = wifi
extra_configs=
    platformio_override.ini
    ;debug.ini

[common_env_data]
lib_deps_builtin = 
	SPI

[common]
build_flags =
	!python git-version.py
	-DCORE_DEBUG_LEVEL=0
	; Web upload chunk size (default 1436). Bigger chunks = ~5.7x fewer
	; uploadWrite iterations (each pays a delay_ms(1) yield) and larger SD
	; writes, so multi-MB pattern uploads from the app drain much faster.
	; Costs ~8KB heap per active upload (HTTPUpload's inline buf).
	-DHTTP_UPLOAD_BUFLEN=8192
	-Wno-unused-variable
	-Wno-unused-function
lib_deps =
	TMCStepper@>=0.7.0,<1.0.0
bt_deps =
	BluetoothSerial
wifi_deps =
	arduinoWebSockets=https://github.com/MitchBradley/arduinoWebSockets#canSend
	WiFi=https://github.com/MitchBradley/WiFi#canWrite
        ; If we include the following explicit dependencies when we get the
        ; Arduino framework code from github, platformio picks up different
        ; and incompatible versions of these libraries from who knows where, 
	; ArduinoOTA
	; DNSServer
	; ESPmDNS
	; Update
	; WebServer
	; WiFi
	; WiFiClientSecure

[common_esp32_base]
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
board_build.arduino.upstream_packages = no

upload_speed = 115200
board_build.partitions = min_littlefs.csv ; For 4M ESP32
board_build.filesystem = littlefs
; board_build.partitions = FluidNC/ld/esp32/app3M_spiffs1M_8MB.csv  ; For 8Meg ESP32
; board_build.partitions = FluidNC/ld/esp32/app3M_spiffs9M_16MB.csv ; For 16Meg ESP32
monitor_speed = 115200
monitor_flags = 
	--eol=LF
monitor_filters=esp32_exception_decoder
board_build.f_flash = 80000000L
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -std=gnu++17 -D_GLIBCXX_HAVE_DIRENT_H -D__FLUIDNC
; -lstdc++fs
build_src_filter =
	+<*.h> +<*.s> +<*.S> +<*.cpp> +<*.c> +<src/>
        +<esp32>
        +<stdfs>
        -<src/WebUI>
        -<src/BTConfig.cpp>
        ; -<src/OLED.cpp>

lib_extra_dirs = 
	libraries

[common_esp32]
; See FluidNC/ld/esp32/README.md
extra_scripts =	FluidNC/ld/esp32/vtable_in_dram.py

extends = common_esp32_base
board = esp32dev

[common_esp32_s3]
extends = common_esp32_base
board = esp32-s3-devkitc-1
lib_deps = ${common.lib_deps}

[common_wifi]
build_src_filter = +<src/WebUI/*.cpp>

[common_bt]
build_src_filter = +<src/BTConfig.cpp> +<src/WebUI/WebCommands.cpp>

[env:debug]
extends = common_esp32
build_type = debug
lib_deps = ${common.lib_deps}

[env:noradio]
extends = common_esp32
lib_deps = ${common.lib_deps}
build_src_filter = ${common_esp32_base.build_src_filter}

[env:wifi]
extends = common_esp32
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter = ${common_esp32_base.build_src_filter} ${common_wifi.build_src_filter}

[sandtable_common]
; Stripped build for polar sand tables (Dune Weaver / MKS-DLC32).
; Excludes CNC subsystems that are only reachable via factory
; registration (see PORTING.md): spindle zoo, VFD protocols, servo and
; the SPI Trinamic drivers, manual ATC, and status-output modules.
; The UART Trinamic path (TrinamicBase + TrinamicUartDriver + TMC2209)
; is kept so "tmc_2209" motors can be configured over UART; this pulls
; the TMCStepper lib back in via ${common.lib_deps}. The SPI drivers
; (TMC2130/2160/5160 + tmc_spi) and the non-addressable TMC2208 stay
; excluded. (OLED/SSD1306 have been removed from the repo entirely -
; this is a headless sand table.)
;
; This section holds only the sand-table source exclusions, so that both the
; ESP32 [env:sandtable] and the ESP32-S3 [env:sandtable_s3] compose the same
; source set on top of their own platform base.
build_src_filter =
	-<src/Spindles/10vSpindle.cpp>
	-<src/Spindles/BESCSpindle.cpp>
	-<src/Spindles/DacSpindle.cpp>
	-<src/Spindles/HBridgeSpindle.cpp>
	-<src/Spindles/LaserSpindle.cpp>
	-<src/Spindles/OnOffSpindle.cpp>
	-<src/Spindles/PlasmaSpindle.cpp>
	-<src/Spindles/PWMSpindle.cpp>
	-<src/Spindles/RelaySpindle.cpp>
	-<src/Spindles/VFDSpindle.cpp>
	-<src/Spindles/VFD/>
	-<src/Motors/Dynamixel2.cpp>
	-<src/Motors/RcServo.cpp>
	-<src/Motors/Servo.cpp>
	-<src/Motors/Solenoid.cpp>
	; UART TMC2209 path kept (TrinamicBase + TrinamicUartDriver + TMC2209).
	-<src/Motors/TrinamicSpiDriver.cpp>
	-<src/Motors/TMC2130Driver.cpp>
	-<src/Motors/TMC2160Driver.cpp>
	-<src/Motors/TMC2160ProDriver.cpp>
	-<src/Motors/TMC2208Driver.cpp>
	-<src/Motors/TMC5160Driver.cpp>
	-<src/Motors/TMC5160ProDriver.cpp>
	-<esp32/tmc_spi.cpp>
	-<esp32/tmc_spi_support.c>
	-<src/ToolChangers/atc_manual.cpp>
	-<src/Status_outputs.cpp>
	; CoreXY stays IN: rectangular tables select `kinematics: CoreXY:` and the
	; self-registering InstanceBuilder only exists if the file is compiled --
	; excluding it makes the config silently fall back to Cartesian ("Ignored
	; key CoreXY" in the boot log), which is how v0.2.1-rc3 shipped broken.
	-<src/Kinematics/Midtbot.cpp>
	-<src/Kinematics/WallPlotter.cpp>
	-<src/Kinematics/ParallelDelta.cpp>
	; Notifications are the only WiFiClientSecure user; excluding them
	; drops the ~160KB mbedTLS stack. Stub provides the two statics
	; that WifiConfig.cpp references.
	-<src/WebUI/NotificationsService.cpp>
	+<sandtable/>

[env:sandtable]
extends = common_esp32
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter =
	${common_esp32_base.build_src_filter}
	${common_wifi.build_src_filter}
	${sandtable_common.build_src_filter}

[env:sandtable_s3]
; Same sand table, ESP32-S3 board (MKS DLC32 MAX). Differences from the
; ESP32 build:
;   - i2s_engine.c is ESP32-only (the S3's I2S peripheral has a different
;     register layout, and upstream only rewrote it for the 4.0 line). The
;     DLC32 MAX has no 74HC595 shift register - step/dir come straight off
;     GPIO - so we drop the engine and stub its four i2s_out_* entry points
;     in sandtable/I2SOStub.cpp for the call sites that are unconditional.
;   - 8MB flash instead of 4MB, so bigger app slots and filesystem.
; Note the S3 bootloader flashes at 0x0, not 0x1000; pio handles that, but
; build-dw-release.py has its own per-MCU image table.
extends = common_esp32_s3
board_build.partitions = sandtable_8MB.csv
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter =
	${common_esp32_base.build_src_filter}
	${common_wifi.build_src_filter}
	${sandtable_common.build_src_filter}
	-<esp32/i2s_engine.c>

[env:bt]
extends = common_esp32
lib_deps = ${common.lib_deps} ${common.bt_deps}
build_src_filter = ${common_esp32_base.build_src_filter} ${common_bt.build_src_filter}

[env:noradio_s3]
extends = common_esp32_s3
lib_deps = ${common.lib_deps}
build_src_filter = ${common_esp32_base.build_src_filter}
build_flags = ${common_esp32_base.build_flags}

[env:wifi_s3]
extends = common_esp32_s3
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter = ${common_esp32_base.build_src_filter} ${common_wifi.build_src_filter}

[env:bt_s3]
extends = common_esp32_s3
lib_deps = ${common.lib_deps} ${common.bt_deps}
build_src_filter = ${common_esp32_base.build_src_filter} ${common_bt.build_src_filter}

