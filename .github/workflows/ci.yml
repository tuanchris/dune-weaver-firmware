name: CI

# Dune Weaver Firmware ships two board targets: `sandtable` (MKS-DLC32 / ESP32,
# 4M) and `sandtable_s3` (MKS DLC32 MAX / ESP32-S3, 8M). This CI does the two
# things that matter for the fork:
#   1. run the native unit tests (ASan/UBSan) — the fast gate on every change
#   2. build both shipping targets — so a broken one fails CI. Both must build:
#      they share every source file, and the S3 differences are compile-time
#      (`CONFIG_IDF_TARGET_ESP32S3` branches in the pin map, the stubbed I2S
#      engine), so an ESP32-only build cannot catch a break on the other side.
# (Upstream FluidNC's noradio/wifi/bt build matrix and Windows portability legs
# were dropped: the fork builds none of those targets and is developed on macOS.)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-tests-${{ runner.os }}
      - name: Run native tests
        run: pio test -e tests -vv

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-sandtable-${{ runner.os }}
      - name: Build sandtable firmware (ESP32 / MKS-DLC32)
        run: pio run -e sandtable
      - name: Build sandtable firmware (ESP32-S3 / MKS DLC32 MAX)
        run: pio run -e sandtable_s3
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandtable-firmware
          path: |
            .pio/build/sandtable/firmware.bin
            .pio/build/sandtable/partitions.bin
            .pio/build/sandtable/bootloader.bin
            .pio/build/sandtable_s3/firmware.bin
            .pio/build/sandtable_s3/partitions.bin
            .pio/build/sandtable_s3/bootloader.bin
