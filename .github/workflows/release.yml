name: Release

# Cut a Dune Weaver Firmware release when a `v*` tag is pushed. Mirrors the
# local flow in RELEASING.md: build the `sandtable` firmware + littlefs image
# via build-dw-release.py (flat .bin images + manifest.json + a convenience
# zip), then publish them as GitHub Release assets. Runs on ubuntu, whose
# bundled x86_64 mklittlefs works (the arm64 mklittlefs swap is a Mac-only note).
#
# Cut a release with:
#   git tag -a v0.1.11 -m "Dune Weaver Firmware v0.1.11"
#   git push origin v0.1.11
# or trigger manually against an existing tag via the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags must be present: the dispatch fallback below and
                          # the annotated-tag re-fetch both need full history
      - name: Resolve the release tag
        run: |
          # The tag being released is the ref that TRIGGERED the run, not
          # whatever `git describe` picks. describe tie-breaks arbitrarily when
          # a commit carries more than one tag, and cutting a final release at
          # the same commit as its last RC does exactly that: pushing v0.1.18 at
          # v0.1.18-rc3's commit made describe answer "v0.1.18-rc3" on the runner
          # (actions/checkout leaves the TRIGGERING tag lightweight, and describe
          # prefers the annotated candidate), so the run staged, versioned and
          # tried to publish the whole release as the RC. It only failed loudly
          # because that release already existed -- otherwise it would have
          # silently shipped a v0.1.18 tag as an rc3 release, firmware version
          # string included.
          # DW_RELEASE_TAG is exported for every later step; build-dw-release.py
          # and git-version.py honor it and fall back to describe when unset, so
          # local builds are unchanged.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # workflow_dispatch from a branch has no tag ref to read.
            TAG="$(git describe --tags --abbrev=0)"
            echo "::notice::dispatched from ${{ github.ref_type }} '${{ github.ref_name }}'; falling back to $TAG"
          fi
          echo "DW_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-sandtable-${{ runner.os }}
      - name: Build release artifacts
        run: python3 build-dw-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same tag the build staged under release/<tag>/ (both read
          # DW_RELEASE_TAG), so the asset glob below cannot miss.
          TAG="$DW_RELEASE_TAG"
          # Release notes come from the annotated tag's BODY (everything after
          # the subject line) -- write the changelog into `git tag -a` per
          # RELEASING.md. `--generate-notes` only summarizes merged PRs, which
          # is empty for direct-to-main commits (the bare "Full Changelog" link
          # bug), so we only fall back to it when the tag has no body.
          # actions/checkout leaves the triggering tag as a LIGHTWEIGHT ref
          # pointing straight at the commit, and for a lightweight tag
          # %(contents:body) yields the COMMIT message body -- so this silently
          # published the tagged commit's message as the release notes instead
          # of the changelog (v0.1.15 and earlier, fixed after v0.1.16 shipped).
          # Re-fetch the real tag object, and only trust the annotation when the
          # ref actually resolves to one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')"
          else
            echo "::warning::$TAG is not an annotated tag; falling back to generated notes"
            NOTES=""
          fi
          # A tag with a pre-release suffix (v0.1.18-rc1, v0.2.0-beta2) ships as a
          # GitHub PRE-RELEASE: testers can install it deliberately, but
          # /releases/latest -- what the installer and "is there an update?"
          # checks follow -- keeps pointing at the last final release, so a
          # release candidate does not push a version bump at every table.
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease"
                 echo "$TAG has a pre-release suffix; publishing as a pre-release" ;;
          esac
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/relnotes.md"
            gh release create "$TAG" --title "$TAG" $PRERELEASE \
              --notes-file "$RUNNER_TEMP/relnotes.md" \
              "release/$TAG"/*
          else
            gh release create "$TAG" --title "$TAG" $PRERELEASE \
              --generate-notes \
              "release/$TAG"/*
          fi
      - name: Track artifacts on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer downloads the firmware binaries from releases/<tag>/ on
          # the default branch (raw.githubusercontent.com/.../<branch>/...), NOT
          # from the GitHub Release assets, so every release must also commit its
          # artifacts there or the installer 404s ("Could not download the release
          # asset"). release/<tag>/ is gitignored + untracked, so it survives the
          # branch checkout; we copy it into the tracked releases/<tag>/.
          # NOTE: this step checks out the default BRANCH, where `git describe`
          # would answer with the branch's last tag rather than the one being
          # released -- another reason the tag is resolved once, up front.
          TAG="$DW_RELEASE_TAG"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p "releases/$TAG"
          cp -f "release/$TAG"/* "releases/$TAG"/
          git add "releases/$TAG"
          if git diff --cached --quiet; then
            echo "artifacts already tracked; nothing to commit"
          else
            git commit -m "Track $TAG release artifacts"
            # one retry in case the branch advanced between fetch and push
            git push origin "HEAD:$BRANCH" || { git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; }
          fi
